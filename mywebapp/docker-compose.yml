version: '3.8'
services:
  sqlserver1:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1533:1433"

  sqlserver2:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1534:1433"

  webapp:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - sqlserver1
      - sqlserver2
    ports:
      - "8000:80"
    environment:
      ASPNETCORE_URLS: "http://+"
      ConnectionStrings__AppDb: "${APPDB_CONNECTION_STRING}"
      ConnectionStrings__LogDb: "${LOGDB_CONNECTION_STRING}"