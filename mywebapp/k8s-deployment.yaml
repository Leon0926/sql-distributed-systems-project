apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: mywebapp-webapp:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        # Create the secret before deploying:
        # kubectl create secret generic app-secrets --from-env-file=.env
        env:
        - name: ASPNETCORE_URLS
          value: "http://+"
        - name: ConnectionStrings__AppDb
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: K8S_APPDB_CONNECTION_STRING
        - name: ConnectionStrings__LogDb
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: K8S_LOGDB_CONNECTION_STRING
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080